[project]
name = "recovery"
version = "0.1.0"
description = "AI revenue recovery for failed recurring collections — Razorpay AI Buildathon, Track 03"
requires-python = ">=3.11"

# Deliberately minimal. The decisioning layer is deterministic Python; the only
# non-stdlib runtime need is a local Ollama HTTP call, which urllib covers. Fewer
# dependencies means fewer ways for a demo to break on someone else's machine.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
